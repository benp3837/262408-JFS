name: Build and Push Docker Image & Elastic Beanstalk Deployment

# This Github Action triggers whenever code is pushed to the main branch
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    # GitHub spins up a fresh Ubuntu VM to run these steps
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Check out the repo code onto the VM
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2 — Install Java 21 on the VM
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # Step 3 — Build the JAR with Maven (skipping tests to keep it fast)
      # I didn't write any tests anyway lolll
      - name: Build with Maven
        working-directory: Week-9/docker/CloudBackend
        run: mvn clean package -DskipTests

      # Step 4 — Log into DockerHub using secrets stored in GitHub
      # Never put credentials directly in the YAML!! always use secrets
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 5 — Build the Docker image and push it to DockerHub
      # context: . means use the Dockerfile in the current directory
      # :latest tag means this is always the most recent version
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: Week-9/docker/CloudBackend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/docker-backend:latest

      # NEW: Step 6 — Deploy the JAR directly to Elastic Beanstalk
      # No SSH, no docker pull — AWS handles the deploy automatically
      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: cloud-backend2
          environment_name: cloud-backend2-env
          region: us-east-1
          version_label: ${{ github.sha }}
          deployment_package: Week-9/docker/CloudBackend/target/DockerBackend-0.0.1-SNAPSHOT.jar

