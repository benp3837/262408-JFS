spring.application.name=SpringAPI

# Setting up Spring Boot Actuator to see different metrics and health stats in our app
# Actuator works by exposing endpoints we can request to in order to get information
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

#DB Setup properties--------------

# Points to our Database -
# NOTE: you'll need a postgres DB and a "games" schema before this works!
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=games

# Using the Postgres Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Credentials (hardcoded, not great)
spring.datasource.username=postgres
spring.datasource.password=password

# Shows any SQL running in your console - great for debugs
spring.jpa.show-sql=true

# Telling Spring Data we want to use Postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# The DDL config for what happens when we run our app
# update == any changes to the DB entities change in the Database
# create == the entire DB gets wiped and recreated
spring.jpa.hibernate.ddl-auto=update

# Janky workaround for the barebones demo to work before spring security----------
spring.mvc.dispatch-options-request=true