<div class="dashboard-header">
  <h2>Dashboard</h2>
  <p>Welcome back! Here's an overview of your users.</p>
</div>

<div class="card">
  <h3>Users</h3>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Role</th>
      </tr>
    </thead>
    <tbody>
      @for (user of users; track user.userId) {
        <tr>
          <td>{{ user.userId }}</td>
          <td>{{ user.username }}</td>
          <td><span class="badge">{{ user.role }}</span></td>
        </tr>
      }
    </tbody>
  </table>
</div>
