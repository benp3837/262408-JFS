<div class="dashboard">
  <h1>Dashboard</h1>
  <p>Welcome back! Here's an overview of your users.</p>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
      </tr>
    </thead>
    <tbody>
      @for (user of users; track user.id) {
        <tr>
          <td>{{ user.id }}</td>
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td><span class="badge">{{ user.role }}</span></td>
        </tr>
      }
    </tbody>
  </table>
</div>
