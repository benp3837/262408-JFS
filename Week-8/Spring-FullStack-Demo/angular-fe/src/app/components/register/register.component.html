<!-- register/register.component.html -->
<form (ngSubmit)="onRegister()">
  <h2>Create an account</h2>

  <div class="form-group">
    <label for="username">Username</label>
    <input id="username" type="text" [(ngModel)]="username" name="username" placeholder="Choose a username" />
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="Choose a password" />
  </div>

  <div class="form-group">
    <label for="confirmPassword">Confirm Password</label>
    <input id="confirmPassword" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirm your password" />
  </div>

  <button type="submit">Register</button>
</form>
