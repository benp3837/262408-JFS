spring:
  application:
    name: APIGateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: userservice
              uri: lb://UserService
              predicates:
                - Path=/users/**
            - id: productservice
              uri: lb://ProductService
              predicates:
                - Path=/products/**
            - id: orderservice
              uri: lb://OrderService
              predicates:
                - Path=/orders/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    ip-address: 127.0.0.1
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    org.springframework.cloud.gateway: DEBUG